<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#02030A;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0A0C1A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#02030A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="acidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C6FF00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00CFFF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:#C6FF00;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(198,255,0,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#grid)"/>

  <!-- ANIMATED ORBS -->
  <circle cx="100" cy="80" r="120" fill="rgba(198,255,0,0.04)" filter="url(#glow)">
    <animate attributeName="r" values="120;140;120" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="220" r="100" fill="rgba(0,207,255,0.04)" filter="url(#glow)">
    <animate attributeName="r" values="100;120;100" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="150" r="80" fill="rgba(255,32,32,0.02)" filter="url(#glow)">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- SCAN LINE -->
  <rect x="0" y="0" width="900" height="1.5" fill="url(#lineGrad)" opacity="0.8">
    <animate attributeName="y" values="-2;302" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.05;0.95;1"/>
  </rect>

  <!-- VERTICAL SCAN -->
  <rect x="0" y="0" width="1.5" height="300" fill="url(#acidGrad)" opacity="0.4">
    <animate attributeName="x" values="-2;902" dur="8s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" values="0;0.4;0;0" dur="8s" repeatCount="indefinite" begin="2s"/>
  </rect>

  <!-- DATA STREAMS -->
  <line x1="150" y1="0" x2="150" y2="300" stroke="rgba(198,255,0,0.06)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="300" stroke="rgba(0,207,255,0.06)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="300" stroke="rgba(198,255,0,0.06)" stroke-width="0.5"/>
  <line x1="750" y1="0" x2="750" y2="300" stroke="rgba(0,207,255,0.06)" stroke-width="0.5"/>

  <!-- MOVING DOTS ON STREAMS -->
  <circle cx="150" cy="0" r="2" fill="#C6FF00" filter="url(#glow)" opacity="0.8">
    <animate attributeName="cy" values="-5;305" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="0" r="2" fill="#00CFFF" filter="url(#glow)" opacity="0.8">
    <animate attributeName="cy" values="-5;305" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="600" cy="0" r="2" fill="#C6FF00" filter="url(#glow)" opacity="0.8">
    <animate attributeName="cy" values="-5;305" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="750" cy="0" r="2" fill="#FF2020" filter="url(#glow)" opacity="0.8">
    <animate attributeName="cy" values="-5;305" dur="5s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <!-- PULSING NODES -->
  <circle cx="80" cy="250" r="4" fill="none" stroke="#C6FF00" stroke-width="1" filter="url(#glow)">
    <animate attributeName="r" values="4;12;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="250" r="2" fill="#C6FF00" filter="url(#glow2)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="820" cy="60" r="4" fill="none" stroke="#00CFFF" stroke-width="1" filter="url(#glow)">
    <animate attributeName="r" values="4;12;4" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="820" cy="60" r="2" fill="#00CFFF" filter="url(#glow2)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- SYS LABEL -->
  <text x="30" y="30" font-family="monospace" font-size="9" fill="rgba(198,255,0,0.5)" letter-spacing="3">
    [SYS.ACTIVE] MOMNA-BIT.GITHUB.IO
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- STATUS DOTS -->
  <circle cx="830" cy="24" r="4" fill="#C6FF00" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="840" y="28" font-family="monospace" font-size="9" fill="rgba(198,255,0,0.7)" letter-spacing="2">LIVE</text>

  <!-- MAIN TITLE -->
  <text x="450" y="120" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="58" font-weight="900" fill="url(#acidGrad)" filter="url(#glow2)" letter-spacing="-2" opacity="0">
    MOMNA ALI
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze" begin="0.3s"/>
    <animate attributeName="y" values="140;120" dur="1.5s" fill="freeze" begin="0.3s"/>
  </text>

  <!-- SUBTITLE LINE 1 -->
  <text x="450" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(242,239,232,0.5)" letter-spacing="3" opacity="0">
    DATA ENGINEER · ML ENGINEER · AI ENGINEER · DATA SCIENTIST · DATA ANALYST
    <animate attributeName="opacity" values="0;0.7" dur="1s" fill="freeze" begin="1s"/>
  </text>

  <!-- SUBTITLE LINE 2 -->
  <text x="450" y="190" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(198,255,0,0.6)" letter-spacing="3" opacity="0">
    TORONTO, ONTARIO, CANADA 🇨🇦
    <animate attributeName="opacity" values="0;0.8" dur="1s" fill="freeze" begin="1.3s"/>
  </text>

  <!-- DECORATIVE LINE BOTTOM -->
  <line x1="200" y1="215" x2="700" y2="215" stroke="url(#lineGrad)" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.6" dur="1s" fill="freeze" begin="1.5s"/>
  </line>

  <!-- BOTTOM STATS -->
  <text x="225" y="245" font-family="monospace" font-size="10" fill="rgba(198,255,0,0.7)" letter-spacing="1" opacity="0">
    7 MICROSERVICES
    <animate attributeName="opacity" values="0;0.8" dur="0.5s" fill="freeze" begin="1.8s"/>
  </text>
  <text x="370" y="245" font-family="monospace" font-size="10" fill="rgba(0,207,255,0.7)" letter-spacing="1" opacity="0">
    4 AI AGENTS
    <animate attributeName="opacity" values="0;0.8" dur="0.5s" fill="freeze" begin="2s"/>
  </text>
  <text x="490" y="245" font-family="monospace" font-size="10" fill="rgba(255,32,32,0.7)" letter-spacing="1" opacity="0">
    61 MLFLOW RUNS
    <animate attributeName="opacity" values="0;0.8" dur="0.5s" fill="freeze" begin="2.2s"/>
  </text>
  <text x="630" y="245" font-family="monospace" font-size="10" fill="rgba(212,160,23,0.8)" letter-spacing="1" opacity="0">
    &lt;5 MIN TO INSIGHT
    <animate attributeName="opacity" values="0;0.8" dur="0.5s" fill="freeze" begin="2.4s"/>
  </text>

  <!-- CORNER BRACKETS -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="rgba(198,255,0,0.3)" stroke-width="1.5" fill="none"/>
  <path d="M 880 20 L 880 50 M 880 20 L 850 20" stroke="rgba(198,255,0,0.3)" stroke-width="1.5" fill="none"/>
  <path d="M 20 280 L 20 250 M 20 280 L 50 280" stroke="rgba(198,255,0,0.3)" stroke-width="1.5" fill="none"/>
  <path d="M 880 280 L 880 250 M 880 280 L 850 280" stroke="rgba(198,255,0,0.3)" stroke-width="1.5" fill="none"/>
</svg>
