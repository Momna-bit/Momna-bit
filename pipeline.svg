<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#02030A"/>
      <stop offset="100%" style="stop-color:#0A0C1A"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="120" fill="url(#bg)"/>

  <!-- PIPELINE NODES -->
  <!-- Node 1: CSV -->
  <rect x="20" y="40" width="80" height="36" rx="3" fill="rgba(198,255,0,0.08)" stroke="rgba(198,255,0,0.4)" stroke-width="1"/>
  <text x="60" y="53" text-anchor="middle" font-family="monospace" font-size="8" fill="#C6FF00" letter-spacing="1">CSV UPLOAD</text>
  <text x="60" y="67" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(198,255,0,0.5)">Azure Blob</text>

  <!-- Arrow + moving dot -->
  <line x1="102" y1="58" x2="138" y2="58" stroke="rgba(198,255,0,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="102" cy="58" r="3" fill="#C6FF00" filter="url(#glow)">
    <animate attributeName="cx" values="102;138;102" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 2: Kafka -->
  <rect x="140" y="40" width="80" height="36" rx="3" fill="rgba(0,207,255,0.08)" stroke="rgba(0,207,255,0.4)" stroke-width="1"/>
  <text x="180" y="53" text-anchor="middle" font-family="monospace" font-size="8" fill="#00CFFF" letter-spacing="1">KAFKA EVENT</text>
  <text x="180" y="67" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(0,207,255,0.5)">4 Topics</text>

  <!-- Arrow -->
  <line x1="222" y1="58" x2="258" y2="58" stroke="rgba(0,207,255,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="222" cy="58" r="3" fill="#00CFFF" filter="url(#glow)">
    <animate attributeName="cx" values="222;258;222" dur="2.2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>

  <!-- Node 3: Airflow -->
  <rect x="260" y="40" width="80" height="36" rx="3" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.4)" stroke-width="1"/>
  <text x="300" y="53" text-anchor="middle" font-family="monospace" font-size="8" fill="#A78BFA" letter-spacing="1">AIRFLOW DAG</text>
  <text x="300" y="67" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(167,139,250,0.5)">5-Task Pipeline</text>

  <line x1="342" y1="58" x2="378" y2="58" stroke="rgba(167,139,250,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="342" cy="58" r="3" fill="#A78BFA" filter="url(#glow)">
    <animate attributeName="cx" values="342;378;342" dur="2.4s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" begin="0.6s"/>
  </circle>

  <!-- Node 4: DBT -->
  <rect x="380" y="40" width="80" height="36" rx="3" fill="rgba(255,105,75,0.08)" stroke="rgba(255,105,75,0.4)" stroke-width="1"/>
  <text x="420" y="53" text-anchor="middle" font-family="monospace" font-size="8" fill="#FF694B" letter-spacing="1">DBT TRANSFORM</text>
  <text x="420" y="67" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(255,105,75,0.5)">RAW→CLEAN→MART</text>

  <line x1="462" y1="58" x2="498" y2="58" stroke="rgba(255,105,75,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="462" cy="58" r="3" fill="#FF694B" filter="url(#glow)">
    <animate attributeName="cx" values="462;498;462" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="0.9s"/>
  </circle>

  <!-- Node 5: AutoML -->
  <rect x="500" y="40" width="80" height="36" rx="3" fill="rgba(255,32,32,0.08)" stroke="rgba(255,32,32,0.4)" stroke-width="1"/>
  <text x="540" y="53" text-anchor="middle" font-family="monospace" font-size="8" fill="#FF2020" letter-spacing="1">AUTOML TRAIN</text>
  <text x="540" y="67" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(255,32,32,0.5)">XGB+LGBM+RF</text>

  <line x1="582" y1="58" x2="618" y2="58" stroke="rgba(255,32,32,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="582" cy="58" r="3" fill="#FF2020" filter="url(#glow)">
    <animate attributeName="cx" values="582;618;582" dur="2.2s" repeatCount="indefinite" begin="1.2s"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" begin="1.2s"/>
  </circle>

  <!-- Node 6: Anomaly -->
  <rect x="620" y="40" width="80" height="36" rx="3" fill="rgba(212,160,23,0.08)" stroke="rgba(212,160,23,0.4)" stroke-width="1"/>
  <text x="660" y="53" text-anchor="middle" font-family="monospace" font-size="8" fill="#D4A017" letter-spacing="1">ANOMALY DETECT</text>
  <text x="660" y="67" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(212,160,23,0.5)">Z-Score + IQR</text>

  <line x1="702" y1="58" x2="738" y2="58" stroke="rgba(212,160,23,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="702" cy="58" r="3" fill="#D4A017" filter="url(#glow)">
    <animate attributeName="cx" values="702;738;702" dur="2.4s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- Node 7: GPT Alert -->
  <rect x="740" y="40" width="80" height="36" rx="3" fill="rgba(198,255,0,0.12)" stroke="rgba(198,255,0,0.6)" stroke-width="1.5"/>
  <text x="780" y="53" text-anchor="middle" font-family="monospace" font-size="8" fill="#C6FF00" letter-spacing="1" filter="url(#glow)">GPT ALERT</text>
  <text x="780" y="67" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(198,255,0,0.6)">Executive Report</text>
  <!-- Pulse on final node -->
  <rect x="740" y="40" width="80" height="36" rx="3" fill="none" stroke="rgba(198,255,0,0.3)" stroke-width="1">
    <animate attributeName="stroke-width" values="1;4;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- TIMING LABEL -->
  <text x="450" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(198,255,0,0.4)" letter-spacing="2">
    ⏱ UNDER 5 MINUTES · ZERO HUMAN INTERVENTION
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
